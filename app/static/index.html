<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root { --bg:#f7f5ef; --card:#fff; --ink:#222; --muted:#777; --accent:#2f6fde; --line:#e4e0d6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Malgun Gothic", sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:18px; }
  header span { color:var(--muted); font-size:13px; font-weight:normal; }
  #chat { max-width:820px; margin:0 auto; padding:20px 16px 170px; }
  .msg { margin:12px 0; padding:12px 14px; border-radius:12px; line-height:1.6; white-space:pre-wrap; }
  .user { background:#dfe9ff; margin-left:15%; }
  .bot { background:var(--card); border:1px solid var(--line); margin-right:5%; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; white-space:normal; }
  .sources { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; font-size:13px; white-space:normal; }
  .sources div { margin:8px 0; }
  .cite { color:var(--accent); font-weight:bold; text-decoration:none; }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:#eee; color:#555; margin-left:4px; }
  .tag.ocr { background:#fff1d6; color:#8a5a00; }
  .tag.low { background:#fde2e2; color:#a33; }
  form { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px 14px; }
  .opts { max-width:820px; margin:0 auto 8px; display:flex; gap:16px; font-size:13px; color:var(--muted); align-items:center; }
  .row { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:56px; padding:10px; font-size:15px; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { background:#9bb5e8; cursor:wait; }
</style>
</head>
<body>
<header><h1>Jarvis <span id="subtitle">· local second brain (127.0.0.1 only)</span></h1></header>
<main id="chat"></main>

<form id="form">
  <div class="opts">
      <label id="sourceBox">Source
      <select id="source">
        <option value="">all</option>
        <option value="saved" selected>saved</option>
        <option value="my_post">my_post</option>
        <option value="thread">thread</option>
        <option value="subtitle">subtitle</option>
        <option value="library">books (도서)</option>
      </select>
    </label>
    <label><input type="checkbox" id="retrieveOnly"> search only (no LLM)</label>
  </div>
  <div class="row">
    <textarea id="question" placeholder="질문을 입력하세요 (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>
    <button id="send" type="submit">보내기</button>
  </div>
</form>

<script>
// ===== Elements =====
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const questionBox = document.getElementById("question");
const sendBtn = document.getElementById("send");
const sourceSel = document.getElementById("source");
const retrieveOnlyBox = document.getElementById("retrieveOnly");


// ===== Safety =====
// Captions are other people's text: turn < > & " ' into harmless symbols so they can never run as HTML/script (XSS)
function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

// Only allow links that start with https:// (blocks tricks like "javascript:...")
function safeUrl(u) {
  return /^https:\/\//.test(u || "") ? u : "";
}

// Link to the ORIGINAL PDF at the right page (books only). Built here from strictly checked parts:
// the server's "url" is never used for books, so a bad value can never become a link
function libraryLink(s) {
  const id = String(s.book_id ?? "");
  const page = Number(s.page);
  if (!/^[0-9a-f]{16}$/.test(id) || !Number.isInteger(page) || page < 1 || page > 100000) return "";
  return `/library/pdf/${id}#page=${page}`;
}

// One link per source: an https link (posts, papers) or the original PDF page (books)
function sourceUrl(s) {
  return safeUrl(s.url) || libraryLink(s);
}


// ===== Chat bubbles =====
// Create one message box, add it to the page, scroll to the bottom
function addMessage(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

// Fill the bot bubble with the answer, numbered sources and timing
function renderAnswer(div, data) {
  let answerHtml;
  if (data.answer === null) {
    answerHtml = "<i>(search only)</i>";
  } else {
    // Escape first, then turn [1], [2] ... into links to that source's post
        // **bold** -> <b>bold</b> (done after escaping, so only our own safe tag is added)
    answerHtml = escapeHtml(data.answer).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(\d+)\]/g, (match, n) => {
      const src = data.sources.find(s => s.n === Number(n));
      const url = src ? sourceUrl(src) : "";
      return url ? `<a class="cite" href="${escapeHtml(url)}" target="_blank" rel="noopener">[${n}]</a>` : match;
    });
  }

  div.innerHTML = answerHtml
    + `<div class="sources">${sourcesHtml(data.sources)}</div>`
    + `<div class="meta">search query: ${escapeHtml(data.search_query)}`
    + ` · retrieve ${data.timing_sec.retrieve}s · generate ${data.timing_sec.generate}s</div>`;
}

// Numbered source list (shared by the final render and the live streaming render)
function sourcesHtml(sources) {
  return sources.map(s => {
    const url = sourceUrl(s);
    if (s.source === "library") {
      const where = s.title ? `${escapeHtml(s.title)} · p.${escapeHtml(s.pages ?? s.page)}` : "library";
      // ocr is the book's OCR confidence (a number), or absent for text books
      const ocr = s.ocr !== undefined ? `<span class="tag ocr">OCR${s.ocr ? " " + escapeHtml(Math.round(s.ocr)) : ""}</span>` : "";
      const low = s.ocr_low ? `<span class="tag low">낮은 신뢰</span>` : "";
      const pdf = url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">PDF ${escapeHtml(s.page)}쪽 열기</a>` : "";
      return `<div><b>[${s.n}]</b> ${where}<span class="tag">${escapeHtml(s.via)}</span>${ocr}${low} ${pdf}<br>`
           + `<span style="color:#666">${escapeHtml(s.preview)}</span></div>`;
    }
    const link = url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">open</a>` : "";
    return `<div><b>[${s.n}]</b> ${escapeHtml(s.source)} · ${escapeHtml(String(s.date).slice(0, 10))}`
         + `<span class="tag">${escapeHtml(s.via)}</span> ${link}<br>`
         + `<span style="color:#666">${escapeHtml(s.preview)}</span></div>`;
  }).join("");
}

// While streaming: only the already-escaped text so far + sources.
// **bold** and [n] links are added once at the end by renderAnswer(), on the escaped FULL text
// (a "**" pair can be split across two chunks, so per-chunk formatting would be wrong)
function renderPartial(div, escapedAnswer, sources) {
  div.innerHTML = escapedAnswer
    + `<div class="sources">${sourcesHtml(sources)}</div>`
    + `<div class="meta">writing…</div>`;
  window.scrollTo(0, document.body.scrollHeight);
}


// ===== Talking to the server =====
// Error the server already handled (429, 422, error event...): retrying with /ask would only count the request twice
class ServerError extends Error {}

// Read the server's reason (e.g. "Too many requests...") and turn it into plain text
async function httpErrorText(res) {
  let detail = "";
  try {
    const body = await res.json();
    detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
  } catch (e) {}
  return `HTTP ${res.status} ${detail}`;
}

// Old way: one request, the whole answer at once
async function askPlain(payload) {
  const res = await fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new ServerError(await httpErrorText(res));
  return res.json();
}

// New way: /ask/stream sends NDJSON lines (sources -> chunk x N -> done) and we draw each one as it arrives
async function askStream(payload, botDiv, onFirstEvent) {
  const res = await fetch("/ask/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    // 404/405 = an older server without /ask/stream -> plain Error, so the caller falls back to /ask
    if (res.status === 404 || res.status === 405) throw new Error(`HTTP ${res.status}`);
    throw new ServerError(await httpErrorText(res));
  }
  // Very old browsers have no ReadableStream reader -> fall back to /ask
  if (!res.body || !res.body.getReader) throw new Error("streaming not supported");

  const reader = res.body.getReader();
  // stream: true keeps a Korean character that was split between two network packets in one piece
  const decoder = new TextDecoder();
  let buffer = "", rawAnswer = "", escapedAnswer = "", meta = null, received = false;
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // Every complete line is one event; the last piece may be half a line, so keep it for the next read
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (!received) { received = true; onFirstEvent(); }
        if (ev.type === "sources") {
          meta = ev;
          renderPartial(botDiv, "", meta.sources);
        } else if (ev.type === "chunk" && meta) {
          rawAnswer += ev.text;
          // Escape EVERY chunk before it touches innerHTML (model output is never trusted as HTML)
          escapedAnswer += escapeHtml(ev.text);
          renderPartial(botDiv, escapedAnswer, meta.sources);
        } else if (ev.type === "error") {
          throw new ServerError(ev.detail);
        } else if (ev.type === "done" && meta) {
          return {
            question: meta.question, search_query: meta.search_query, sources: meta.sources,
            answer: payload.retrieve_only ? null : rawAnswer, timing_sec: ev.timing_sec,
          };
        }
      }
    }
  } catch (err) {
    // Once something was shown, do not silently re-ask: the server already counted this request
    if (err instanceof ServerError || !received) throw err;
    throw new ServerError("연결이 중간에 끊겼어요");
  }
  if (received) throw new ServerError("답변이 중간에 끊겼어요");
  throw new Error("empty stream");
}


// ===== Send a question (streaming first, /ask as the fallback) =====
async function ask(question) {
  addMessage("user", escapeHtml(question));
  const botDiv = addMessage("bot", "생각 중… 0s");
  const start = Date.now();
  // Count seconds while waiting, so it is clear the LLM is still working
  const timer = setInterval(() => {
    botDiv.textContent = `생각 중… ${Math.round((Date.now() - start) / 1000)}s`;
  }, 1000);
  sendBtn.disabled = true;

  const payload = {
    question: question,
    source: sourceSel.value || null,
    retrieve_only: retrieveOnlyBox.checked,
  };

  try {
    let data;
    try {
      // The waiting timer stops as soon as the first event (sources) arrives
      data = await askStream(payload, botDiv, () => clearInterval(timer));
    } catch (err) {
      if (err instanceof ServerError) throw err;
      // Streaming was not possible and nothing was shown yet -> same question through the plain /ask
      console.warn("stream failed, falling back to /ask:", err);
      data = await askPlain(payload);
    }
    clearInterval(timer);
    renderAnswer(botDiv, data);
  } catch (err) {
    clearInterval(timer);
    botDiv.textContent = "에러: " + err.message + " (서버가 켜져 있는지 확인하세요)";
  } finally {
    sendBtn.disabled = false;
    questionBox.focus();
  }
}


// ===== Input handling =====
form.addEventListener("submit", (e) => {
  // Stop the browser from reloading the page on submit
  e.preventDefault();
  const q = questionBox.value.trim();
  if (!q || sendBtn.disabled) return;
  questionBox.value = "";
  ask(q);
});

questionBox.addEventListener("keydown", (e) => {
  // isComposing: true while a Korean syllable is still being typed.
  // Without this check, pressing Enter mid-syllable sends the message twice
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// ===== Adjust the page when the server runs in cloud mode =====
// /health tells which mode the server is in; the cloud demo searches public papers only
fetch("/health")
  .then(r => r.json())
  .then(h => {
    if (h.mode === "cloud") {
      document.title = "Jarvis · Medical AI Papers";
      document.getElementById("subtitle").textContent =
        "· medical AI paper search (arXiv + Gemini) · questions are logged for service quality";
      // Source choice only matters for the private local data, so hide it
      document.getElementById("sourceBox").style.display = "none";
      sourceSel.value = "";
      questionBox.placeholder = "Ask about medical AI papers (English works best, 한국어도 가능)";
    }
  })
  .catch(() => {});
</script>
</body>
</html>
